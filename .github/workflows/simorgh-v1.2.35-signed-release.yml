name: SIMORGH Android Signed Release v1.2.35

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag"
        required: true
        default: "v1.2.35"
      release_name:
        description: "GitHub Release title"
        required: true
        default: "SIMORGH VPN v1.2.35"
      prerelease:
        description: "Mark as pre-release"
        required: true
        type: boolean
        default: false
      project_dir:
        description: "Optional Gradle project directory, leave empty for auto-detect"
        required: false
        default: ""

  push:
    tags:
      - "v1.2.35"
      - "v1.2.35-*"

permissions:
  contents: write

jobs:
  build-signed-release:
    name: Build Signed Android Release
    runs-on: ubuntu-latest

    env:
      VERSION_NAME: "1.2.35"
      FINAL_APK_NAME: "SIMORGH-v1.2.35-amd64-v8.apk"
      XRAY_VERSION: "v26.6.22"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g"
      SIMORGH_REFRESH_XRAY: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Auto-extract source ZIP when repository has no Gradle root
        shell: bash
        run: |
          set -e
          if find "$GITHUB_WORKSPACE" -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts -o -name settings.gradle.dcl \) | grep -q .; then
            echo "Gradle root already exists in repository."
            exit 0
          fi

          zip_file="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "*.zip" | head -n 1 || true)"
          if [ -n "$zip_file" ]; then
            echo "No Gradle root found. Extracting source ZIP: $zip_file"
            mkdir -p "$GITHUB_WORKSPACE/__extracted_source"
            unzip -q "$zip_file" -d "$GITHUB_WORKSPACE/__extracted_source"
          else
            echo "No Gradle root found and no ZIP source file found."
          fi

      - name: Detect Gradle project root
        shell: bash
        run: |
          set -e

          input_dir="${{ github.event.inputs.project_dir || '' }}"
          if [ -n "$input_dir" ]; then
            candidate="$GITHUB_WORKSPACE/$input_dir"
            if [ ! -d "$candidate" ]; then
              echo "Provided project_dir does not exist: $candidate"
              exit 1
            fi
            if [ ! -f "$candidate/settings.gradle" ] && [ ! -f "$candidate/settings.gradle.kts" ] && [ ! -f "$candidate/settings.gradle.dcl" ]; then
              echo "Provided project_dir is not a Gradle root: $candidate"
              exit 1
            fi
            root="$candidate"
          else
            root="$(find "$GITHUB_WORKSPACE" -maxdepth 8 \( -name settings.gradle -o -name settings.gradle.kts -o -name settings.gradle.dcl \) -printf '%h\n' | head -n 1 || true)"
          fi

          if [ -z "$root" ]; then
            echo "Could not find Gradle project root."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort | sed 's#^# - #'
            exit 1
          fi

          echo "Detected Gradle root: $root"
          echo "BUILD_DIR=$root" >> "$GITHUB_ENV"

      - name: Detect Gradle command
        shell: bash
        run: |
          set -e

          wrapper="$(find "$BUILD_DIR" "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name gradlew | head -n 1 || true)"
          if [ -n "$wrapper" ]; then
            chmod +x "$wrapper"
            echo "Using Gradle wrapper: $wrapper"
            echo "GRADLE_CMD=$wrapper" >> "$GITHUB_ENV"
          else
            echo "No Gradle wrapper found. Using pinned Gradle 9.5.1."
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up pinned Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Validate signing secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          missing=0

          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Missing secret: SIGNING_KEYSTORE_BASE64"
            missing=1
          else
            echo "SIGNING_KEYSTORE_BASE64 is set"
          fi

          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "Missing secret: SIGNING_STORE_PASSWORD"
            missing=1
          else
            echo "SIGNING_STORE_PASSWORD is set"
          fi

          if [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "Missing secret: SIGNING_KEY_ALIAS"
            missing=1
          else
            echo "SIGNING_KEY_ALIAS is set"
          fi

          if [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Missing secret: SIGNING_KEY_PASSWORD"
            missing=1
          else
            echo "SIGNING_KEY_PASSWORD is set"
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Signing secrets are required."
            exit 1
          fi

      - name: Decode release keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          KEYSTORE_FILE="$RUNNER_TEMP/simorgh-release.jks"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Show build environment
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          echo "SIMORGH_VERSION=$VERSION_NAME"
          echo "FINAL_APK_NAME=$FINAL_APK_NAME"
          echo "XRAY_VERSION=$XRAY_VERSION"
          echo "BUILD_DIR=$BUILD_DIR"
          echo "GRADLE_CMD=$GRADLE_CMD"
          java -version
          "$GRADLE_CMD" --version

      - name: Build release APK
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -e

          if "$GRADLE_CMD" :app:tasks --all >/dev/null 2>&1; then
            echo "Detected :app module. Building :app:assembleRelease"
            "$GRADLE_CMD" clean :app:assembleRelease -Psimorgh.refreshXray=true --stacktrace
          else
            echo "No :app module detected. Building root assembleRelease"
            "$GRADLE_CMD" clean assembleRelease -Psimorgh.refreshXray=true --stacktrace
          fi

      - name: Locate Android build tools
        shell: bash
        run: |
          set -e
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$ZIPALIGN" ] || [ -z "$APKSIGNER" ]; then
            echo "zipalign or apksigner not found in Android SDK build-tools."
            exit 1
          fi

          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Sign release APK
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/signed-release-artifacts"

          release_apk="$(find "$BUILD_DIR" -type f -path "*/build/outputs/apk/release/*.apk" | sort | head -n 1 || true)"
          if [ -z "$release_apk" ]; then
            echo "No release APK file found under: $BUILD_DIR"
            find "$BUILD_DIR" -maxdepth 7 -type f | sort | sed 's#^# - #'
            exit 1
          fi

          aligned="$RUNNER_TEMP/aligned-release.apk"
          final_apk="$GITHUB_WORKSPACE/signed-release-artifacts/$FINAL_APK_NAME"

          echo "Source APK: $release_apk"
          echo "Final signed APK: $final_apk"

          "$ZIPALIGN" -p -f 4 "$release_apk" "$aligned"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --out "$final_apk" \
            "$aligned"

          "$APKSIGNER" verify --verbose --print-certs "$final_apk"

          find "$GITHUB_WORKSPACE/signed-release-artifacts" -type f -name "*.apk" -print
          ls -lah "$GITHUB_WORKSPACE/signed-release-artifacts"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIMORGH-v1.2.35-signed-release-apk
          path: signed-release-artifacts/SIMORGH-v1.2.35-amd64-v8.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || 'SIMORGH VPN v1.2.35' }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body: |
            # 🚀 تغییرات نسخه 1.2.35 نسبت به نسخه مستندشده در README

            ## 🇮🇷 فارسی

            ### 🔄 بروزرسانی کلی
            - نسخه برنامه از نسخه مستندشده در README یعنی **1.2.1** به **1.2.35** ارتقا پیدا کرد.

            ### ⚡ Simple
            - صفحه پیش‌فرض برنامه روی **Simple** تنظیم شد.
            - بخش جدید **Sub/Config** به Simple اضافه شد.
            - امکان ساخت چند پروفایل جداگانه برای لینک ساب یا کانفیگ مستقیم اضافه شد.
            - هر پروفایل Sub/Config دارای دکمه‌های **Add / Edit / Update / Delete** است.
            - نام هر کانفیگ از خود کانفیگ خوانده و نمایش داده می‌شود.
            - کنار هر کانفیگ دکمه **Ping** برای گرفتن latency اضافه شد.
            - کنار هر کانفیگ دکمه **Connect** برای اتصال مستقیم اضافه شد.
            - اتصال کانفیگ‌های Sub/Config بدون استفاده از بالانسر Simple انجام می‌شود.

            ### 🧩 Fragment
            - سیستم پروفایل برای Fragment اضافه و کامل‌تر شد.
            - امکان ساخت، انتخاب، ویرایش، تغییر نام و حذف پروفایل‌های Fragment اضافه شد.
            - بخش **Profiles** در Fragment به حالت Hide/Show درآمد.
            - دکمه **Show/Hide Profiles** به **Profiles** تغییر نام داد.
            - دکمه مداد در پروفایل‌های Fragment به دکمه متنی **Edit** تغییر کرد.

            ### 🌀 NipoVPN
            - دکمه **Show/Hide Profiles** در Nipo به **Profiles** تغییر نام داد.
            - دکمه مداد پروفایل‌ها به دکمه شیشه‌ای **Edit** تغییر کرد.
            - آیکن کپی پروفایل‌ها به دکمه شیشه‌ای **Copy** تغییر کرد.
            - دکمه **Test** به **Ping** تغییر نام داد.
            - ظاهر بخش پروفایل‌ها با تم کلی برنامه هماهنگ‌تر شد.

            ### 🎨 UI / ظاهر برنامه
            - فونت‌های اختصاصی regular و bold در بخش‌های مختلف رابط کاربری اعمال شدند.


            ### 🛡️ MSP
            - چینش **Scanned / Clean / Saved** در بخش Route اصلاح شد.
            - دکمه‌های Route و IP Memory از نظر متن و ظاهر هماهنگ‌تر شدند.
            - نام **Latency** در بخش‌های مختلف به **Ping** تغییر کرد.
            - نمایش SOCKS5 و حباب‌های مرتبط اصلاح شد.


            # 🚀 Changelog v1.2.35 Compared to the README Version

            ## 🇬🇧 English

            ### 🔄 General Update
            - The app version has been upgraded from the README-documented version **1.2.1** to **1.2.35**.

            ### ⚡ Simple
            - The default landing page is now **Simple**.
            - Added a new **Sub/Config** section to the Simple page.
            - Added support for multiple custom profiles for subscription links or direct configs.
            - Each Sub/Config profile now supports **Add / Edit / Update / Delete**.
            - Custom Sub/Config profiles are stored separately from the internal subscription and Serverless mode.
            - Config names are now extracted from the config itself and displayed in the list.
            - Added a **Ping** button next to each config to measure latency.
            - Added a **Connect** button next to each config for direct connection.
            - Sub/Config connections do not use the Simple balancer.

            ### 🧩 Fragment
            - Added and improved the Fragment profile system.
            - Added support for creating, selecting, editing, renaming, and deleting Fragment profiles.
            - The Fragment **Profiles** section now supports Hide/Show.
            - Renamed **Show/Hide Profiles** to **Profiles**.
            - Replaced the pencil icon in Fragment profiles with a text-based **Edit** button.
            - Improved Address, Config, and related information bubble layouts.

            ### 🌀 NipoVPN
            - Renamed **Show/Hide Profiles** to **Profiles**.
            - Replaced the profile pencil icon with a glass-style **Edit** button.
            - Replaced the copy icon with a glass-style **Copy** button.
            - Renamed **Test** to **Ping**.
            - Improved the visual consistency of the Nipo profile area with the overall app theme.

            ### 🎨 UI / Visual Updates
            - Applied custom regular and bold fonts across different UI sections.


            ### 🛡️ MSP
            - Improved the **Scanned / Clean / Saved** layout in the Route section.
            - Updated Route and IP Memory button labels and styling.
            - Renamed **Latency** labels to **Ping** where applicable.
            - Improved SOCKS5 and related information bubble display.
          files: |
            signed-release-artifacts/SIMORGH-v1.2.35-amd64-v8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
