name: SIMORGH Android Signed Release v2.0.1

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag"
        required: true
        default: "v2.0.1"
      release_name:
        description: "GitHub Release title"
        required: true
        default: "SIMORGH VPN v2.0.1"
      prerelease:
        description: "Mark as pre-release"
        required: true
        type: boolean
        default: false
      project_dir:
        description: "Optional Gradle project directory, leave empty for auto-detect"
        required: false
        default: ""

  push:
    tags:
      - "v2.0.1"
      - "v2.0.1-*"

permissions:
  contents: write

jobs:
  build-signed-release:
    name: Build Signed Android Release
    runs-on: ubuntu-latest

    env:
      VERSION_NAME: "v2.0.1"
      FINAL_APK_NAME: "SIMORGH-v2.0.1-arm64-v8a.apk"
      XRAY_VERSION: "v26.10.21"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g"
      SIMORGH_REFRESH_XRAY: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Auto-extract source ZIP when repository has no Gradle root
        shell: bash
        run: |
          set -e
          if find "$GITHUB_WORKSPACE" -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts -o -name settings.gradle.dcl \) | grep -q .; then
            echo "Gradle root already exists in repository."
            exit 0
          fi

          zip_file="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "*.zip" | head -n 1 || true)"
          if [ -n "$zip_file" ]; then
            echo "No Gradle root found. Extracting source ZIP: $zip_file"
            mkdir -p "$GITHUB_WORKSPACE/__extracted_source"
            unzip -q "$zip_file" -d "$GITHUB_WORKSPACE/__extracted_source"
          else
            echo "No Gradle root found and no ZIP source file found."
          fi

      - name: Detect Gradle project root
        shell: bash
        env:
          PROJECT_DIR: ${{ github.event.inputs.project_dir }}
        run: |
          set -e

          input_dir="${PROJECT_DIR:-}"
          if [ -n "$input_dir" ]; then
            case "$input_dir" in
              /*|..|../*|*/../*)
                echo "project_dir must be a relative directory inside the repository."
                exit 1
                ;;
            esac
            candidate="$(realpath "$GITHUB_WORKSPACE/$input_dir")"
            case "$candidate/" in
              "$GITHUB_WORKSPACE/"*) ;;
              *)
                echo "project_dir resolves outside the repository."
                exit 1
                ;;
            esac
            if [ ! -d "$candidate" ]; then
              echo "Provided project_dir does not exist: $candidate"
              exit 1
            fi
            if [ ! -f "$candidate/settings.gradle" ] && [ ! -f "$candidate/settings.gradle.kts" ] && [ ! -f "$candidate/settings.gradle.dcl" ]; then
              echo "Provided project_dir is not a Gradle root: $candidate"
              exit 1
            fi
            root="$candidate"
          else
            root="$(find "$GITHUB_WORKSPACE" -maxdepth 8 \( -name settings.gradle -o -name settings.gradle.kts -o -name settings.gradle.dcl \) -printf '%h\n' | head -n 1 || true)"
          fi

          if [ -z "$root" ]; then
            echo "Could not find Gradle project root."
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | sort | sed 's#^# - #'
            exit 1
          fi

          echo "Detected Gradle root: $root"
          echo "BUILD_DIR=$root" >> "$GITHUB_ENV"

      - name: Detect Gradle command
        shell: bash
        run: |
          set -e

          wrapper="$(find "$BUILD_DIR" -maxdepth 4 -type f -name gradlew -print -quit || true)"
          if [ -n "$wrapper" ]; then
            chmod +x "$wrapper"
            echo "Using Gradle wrapper: $wrapper"
            echo "GRADLE_CMD=$wrapper" >> "$GITHUB_ENV"
          else
            echo "No Gradle wrapper found. Using pinned Gradle 8.13."
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.14904198 cmake;3.22.1"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up pinned Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate signing secrets
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          missing=0

          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Missing secret: SIGNING_KEYSTORE_BASE64"
            missing=1
          else
            echo "SIGNING_KEYSTORE_BASE64 is set"
          fi

          if [ -z "$SIGNING_STORE_PASSWORD" ]; then
            echo "Missing secret: SIGNING_STORE_PASSWORD"
            missing=1
          else
            echo "SIGNING_STORE_PASSWORD is set"
          fi

          if [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "Missing secret: SIGNING_KEY_ALIAS"
            missing=1
          else
            echo "SIGNING_KEY_ALIAS is set"
          fi

          if [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "Missing secret: SIGNING_KEY_PASSWORD"
            missing=1
          else
            echo "SIGNING_KEY_PASSWORD is set"
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Signing secrets are required."
            exit 1
          fi

      - name: Decode release keystore
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -e
          KEYSTORE_FILE="$RUNNER_TEMP/simorgh-release.jks"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Show build environment
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          echo "SIMORGH_VERSION=$VERSION_NAME"
          echo "FINAL_APK_NAME=$FINAL_APK_NAME"
          echo "XRAY_VERSION=$XRAY_VERSION"
          echo "BUILD_DIR=$BUILD_DIR"
          echo "GRADLE_CMD=$GRADLE_CMD"
          java -version
          "$GRADLE_CMD" --version

      - name: Build release APK
        shell: bash
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -e

          if [ -f "$BUILD_DIR/app/build.gradle" ] || [ -f "$BUILD_DIR/app/build.gradle.kts" ]; then
            echo "Detected :app module. Building :app:assembleRelease"
            "$GRADLE_CMD" clean :app:assembleRelease "-Psimorgh.xrayVersion=$XRAY_VERSION" "-Psimorgh.refreshXray=$SIMORGH_REFRESH_XRAY" --stacktrace
          else
            echo "No :app module detected. Building root assembleRelease"
            "$GRADLE_CMD" clean assembleRelease "-Psimorgh.xrayVersion=$XRAY_VERSION" "-Psimorgh.refreshXray=$SIMORGH_REFRESH_XRAY" --stacktrace
          fi

      - name: Locate Android build tools
        shell: bash
        run: |
          set -e
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$ZIPALIGN" ] || [ -z "$APKSIGNER" ]; then
            echo "zipalign or apksigner not found in Android SDK build-tools."
            exit 1
          fi

          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Sign release APK
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/signed-release-artifacts"

          release_apk="$(find "$BUILD_DIR" -type f -path "*/build/outputs/apk/release/*.apk" | sort | head -n 1 || true)"
          if [ -z "$release_apk" ]; then
            echo "No release APK file found under: $BUILD_DIR"
            find "$BUILD_DIR" -maxdepth 7 -type f | sort | sed 's#^# - #'
            exit 1
          fi

          aligned="$RUNNER_TEMP/aligned-release.apk"
          final_apk="$GITHUB_WORKSPACE/signed-release-artifacts/$FINAL_APK_NAME"

          echo "Source APK: $release_apk"
          echo "Final signed APK: $final_apk"

          "$ZIPALIGN" -p -f 4 "$release_apk" "$aligned"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --out "$final_apk" \
            "$aligned"

          "$APKSIGNER" verify --verbose --print-certs "$final_apk"

          find "$GITHUB_WORKSPACE/signed-release-artifacts" -type f -name "*.apk" -print
          ls -lah "$GITHUB_WORKSPACE/signed-release-artifacts"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIMORGH-v2.0.1-signed-release-apk
          path: signed-release-artifacts/SIMORGH-v2.0.1-arm64-v8a.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || 'SIMORGH VPN v2.0.1' }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          body: |
            # 🚀 SIMORGH VPN v2.0.1

            ## 🇮🇷 فارسی

            - نسخهٔ برنامه به **v2.0.1** ارتقا پیدا کرد.
            - Xray-core به نسخهٔ **26.10.21** به‌روزرسانی شد.
            - تم برنامه فقط حالت شب را دارد و رنگ متن‌ها و دکمه‌ها در کارت‌ها هماهنگ‌تر شده است.
            - پس‌زمینهٔ صفحهٔ اصلی و هدر ساده‌تر و مدرن‌تر شد.
            - در ServerLess، کانفیگ از فهرست انتخاب می‌شود و اتصال با دکمهٔ اصلی CONNECT انجام می‌شود.
            - دکمهٔ **Update Subscription** زیر دکمهٔ CONNECT قرار گرفت.

            ## 🇬🇧 English

            - The app is now at version **v2.0.1**.
            - Updated Xray-core to **v26.10.21**.
            - The app uses a dark-only theme with consistent text and button contrast across cards.
            - Simplified and modernized the home and header backgrounds.
            - ServerLess configs are selected from the list and connected with the main CONNECT button.
            - Moved **Update Subscription** below CONNECT.
          files: |
            signed-release-artifacts/SIMORGH-v2.0.1-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
