name: Build and Release SIMORGH APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, example: v1.1.23.45"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_release_apk:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode release keystore
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/simorgh-release.jks"

      - name: Build signed release APK
        working-directory: app
        shell: bash
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/simorgh-release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.SIGNING_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.SIGNING_KEY_PASSWORD }}"

      - name: Prepare APK
        id: apk
        working-directory: app
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' build.gradle.kts | head -1)

          TAG="$GITHUB_REF_NAME"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            if [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
            fi
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v${VERSION_NAME}"
          fi

          APK_IN="build/outputs/apk/release/app-release.apk"
          APK_OUT="$GITHUB_WORKSPACE/SIMORGH-v${VERSION_NAME}-arm64-v8.apk"

          cp "$APK_IN" "$APK_OUT"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIMORGH-release-apk
          path: ${{ steps.apk.outputs.apk }}

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.apk.outputs.tag }}"
          APK="${{ steps.apk.outputs.apk }}"
          VERSION_NAME="${{ steps.apk.outputs.version_name }}"
          VERSION_CODE="${{ steps.apk.outputs.version_code }}"

          cat > release_notes.md <<EOF
          SIMORGH Android release.

          Version name: $VERSION_NAME
          Version code: $VERSION_CODE

          Built automatically with GitHub Actions.
          EOF

          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "SIMORGH $VERSION_NAME" --notes-file release_notes.md
          fi
