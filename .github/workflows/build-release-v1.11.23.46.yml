name: Build and Release SIMORGH APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, example: v1.11.23.46"
        required: false
        default: "v1.11.23.46"
  push:
    tags:
      - "v1.11.23.46"

permissions:
  contents: write

jobs:
  build_release_apk:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Use GitHub Actions safe Gradle memory
        working-directory: app
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
          org.gradle.daemon=true
          org.gradle.parallel=false
          org.gradle.caching=true
          org.gradle.configureondemand=false
          org.gradle.workers.max=1
          org.gradle.vfs.watch=false

          android.useAndroidX=true
          android.enableJetifier=false
          android.nonTransitiveRClass=true
          android.nonFinalResIds=false

          kotlin.code.style=official
          kotlin.compiler.execution.strategy=in-process
          kotlin.incremental=false
          kotlin.daemon.useFallbackStrategy=true
          EOF
          free -h

      - name: Decode release keystore
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > "$GITHUB_WORKSPACE/simorgh-release.jks"

      - name: Build signed release APK
        working-directory: app
        shell: bash
        timeout-minutes: 35
        run: |
          gradle assembleRelease --no-daemon --stacktrace --console=plain --info \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/simorgh-release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.SIGNING_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.SIGNING_KEY_PASSWORD }}"

      - name: Prepare APK
        id: apk
        working-directory: app
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' build.gradle.kts | head -1)
          RELEASE_VERSION="v1.11.23.46"

          TAG="$RELEASE_VERSION"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            if [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
            fi
          fi

          echo "Available APK outputs:"
          find build/outputs/apk -type f -name "*.apk" -print || true

          APK_IN=$(find build/outputs/apk/release -type f -name "*.apk" | head -1)
          if [ -z "$APK_IN" ]; then
            echo "No release APK found under build/outputs/apk/release"
            exit 1
          fi

          APK_OUT="$GITHUB_WORKSPACE/SIMORGH-${TAG}-arm64-v8.apk"
          cp "$APK_IN" "$APK_OUT"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIMORGH-release-apk
          path: ${{ steps.apk.outputs.apk }}

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.apk.outputs.tag }}"
          APK="${{ steps.apk.outputs.apk }}"
          VERSION_NAME="${{ steps.apk.outputs.version_name }}"
          VERSION_CODE="${{ steps.apk.outputs.version_code }}"

          cat > release_notes.md <<'EOF'
          ## 🚀 SIMORGH VPN v1.11.23.46

          ### ✨ Changes compared to v1.11.23.45

          * 🧠 Improved **Simple Mode** connection stability
          * ⚡ Added safer click handling for the **Simple Connect** button to prevent duplicate connect jobs and random crashes
          * 🛡️ Added protection against simultaneous connect/disconnect race conditions
          * 📡 Improved **Real Xray Health Test** behavior for Simple configs
          * 🎯 Simple Mode now keeps selecting the lowest-ping healthy config more reliably
          * 🔄 Improved auto-best selection behavior after health checks
          * 🧪 ServerLess startup is now more reliable when latency test fails
          * 🌐 ServerLess can now start directly even if the external ping endpoint does not respond
          * 🧹 Reduced app cache usage during Xray health tests
          * 🗑️ Improved cleanup of temporary Xray runtime cache
          * 🧭 Optimized `geoip.dat` / `geosite.dat` handling to avoid unnecessary cache growth
          * 🔒 Safer cleanup of geo assets only when VPN is not active
          * 📋 Removed extra helper text from the Simple configs list
          * 🏷️ Updated in-app displayed version to `v1.11.23.46`
          * 🧾 Updated Android `versionName` to `v1.11.23.46`
          * 📦 Kept `versionCode` at `12346` for safe installation over the previous build

          ### 🛠️ Notes

          * ServerLess, Simple Balancer, and Real Xray Scanner logic were preserved while applying targeted stability and cache fixes.
          * This release focuses on stability, lower cache usage, and safer Simple Mode connection handling.

          ## 🚀 سیمُرغ VPN نسخه v1.11.23.46

          ### ✨ تغییرات نسبت به نسخه v1.11.23.45

          * 🧠 بهبود پایداری اتصال در بخش **Simple Mode**
          * ⚡ اضافه شدن محافظ برای دکمه **Simple Connect** جهت جلوگیری از اجرای همزمان چند اتصال و کرش‌های تصادفی
          * 🛡️ جلوگیری از تداخل همزمان بین Connect و Disconnect
          * 📡 بهبود رفتار **تست سلامت واقعی Xray** برای کانفیگ‌های Simple
          * 🎯 انتخاب مطمئن‌تر کانفیگ سالم با کمترین ping در بخش Simple
          * 🔄 بهبود عملکرد انتخاب خودکار بهترین کانفیگ بعد از تست سلامت
          * 🧪 پایدارتر شدن شروع اتصال **ServerLess**
          * 🌐 امکان شروع ServerLess حتی در صورت پاسخ ندادن endpoint تست ping
          * 🧹 کاهش مصرف cache برنامه هنگام تست‌های Xray
          * 🗑️ بهبود پاک‌سازی cache موقت runtime مربوط به Xray
          * 🧭 بهینه‌سازی مدیریت فایل‌های `geoip.dat` و `geosite.dat` برای جلوگیری از رشد بی‌دلیل cache
          * 🔒 پاک‌سازی امن‌تر فایل‌های geo فقط زمانی که VPN فعال نیست
          * 📋 حذف متن اضافی از لیست کانفیگ‌های Simple
          * 🏷️ به‌روزرسانی نسخه نمایش‌داده‌شده داخل برنامه به `v1.11.23.46`
          * 🧾 به‌روزرسانی Android `versionName` به `v1.11.23.46`
          * 📦 حفظ `versionCode` روی `12346` برای نصب امن روی نسخه قبلی

          ### 🛠️ توضیحات

          * منطق اصلی ServerLess، Simple Balancer و Real Xray Scanner حفظ شده و فقط اصلاحات هدفمند برای پایداری، کاهش cache و جلوگیری از کرش اعمال شده است.
          * تمرکز این نسخه روی پایداری بیشتر، مصرف cache کمتر و مدیریت امن‌تر اتصال در بخش Simple Mode است.
          EOF

          git tag "$TAG" 2>/dev/null || true
          git push origin "$TAG" 2>/dev/null || true

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "SIMORGH VPN v1.11.23.46" --notes-file release_notes.md
          fi
